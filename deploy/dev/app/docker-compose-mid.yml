#启动命令 docker compose -p flashcode -f docker-compose-mid.yml up -d
services:
  flashcode-mysql:
    container_name: flashcode-mysql
    image: mysql:8.4.2
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - ../data/flashcodedata/mysql/data:/var/lib/mysql
      # 配置挂载
      - ./mysql/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/sql:/opt/sql
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1',
      '--explicit_defaults_for_timestamp=true',
      '--server-id=1',
      '--log-bin=mysql-bin',
      '--binlog-ignore-db=mysql',
      '--binlog-cache-size=256M',
      '--binlog-format=ROW',
      '--max_connections=2000'
    ]
    restart: always
    networks:
      - flashcode_network
    healthcheck:
      test: mysql --user=bitedev -h127.0.0.1 --password='bite@123' -e "SELECT 1;"
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: bite@123
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
  flashcode-nacos:
    container_name: flashcode-nacos
    image: nacos/nacos-server:v2.2.2
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=flashcode-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=flashcode_nacos_dev
      - MYSQL_SERVICE_USER=bitedev
      - MYSQL_SERVICE_PASSWORD=bite@123
    volumes:
      - ../data/flashcodedata/nacos/logs/:/home/nacos/logs
      - ../data/flashcodedata/nacos/tomcatlogs/:/home/bit/nacos/tomcat/logs/
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    restart: always
    networks:
      - flashcode_network
    depends_on:
      flashcode-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
  flashcode-redis:
    container_name: flashcode-redis
    image: redis:7.0.15
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ../data/flashcodedata/redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      - flashcode_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  flashcode-rabbitmq:
    image: rabbitmq:3.12.6-management
    container_name: flashcode-rabbitmq
    restart: always
    hostname: flashcode-rabbitmq
    environment:
      # 用户名
      RABBITMQ_DEFAULT_USER: admin
      # 密码
      RABBITMQ_DEFAULT_PASS: bite@123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../data/flashcodedata/rabbitmq/log:/var/log/rabbitmq
      - ../data/flashcodedata/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - flashcode_network
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 10
  flashcode-userapp-preview:
    container_name: flashcode-userapp-preview
    image: flashcode/userapp
    build:
      context: .
      dockerfile: ./require-image/preview/Dockerfile
    volumes:
      - ../data/flashcodedata/flashcode-app/user-preview:/workspace/user-preview
      - ./require-image/preview/nginx/script:/workspace/scripts
      - ./require-image/preview/nginx/config/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    restart: always
    networks:
      - flashcode_network


    # 在同一台主机上，服务之间的依赖关系可以通过 depends_on 来指定。
    depends_on:
      flashcode-mysql:
        condition: service_healthy
      flashcode-nacos:
        condition: service_healthy
      flashcode-redis:
        condition: service_healthy
      flashcode-rabbitmq:
        condition: service_healthy

networks:
  flashcode_network: