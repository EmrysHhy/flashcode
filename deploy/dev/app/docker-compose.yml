version: '3.5'

services:
  flashcode-milvus-etcd:
    container_name: flashcode-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ../data/flashcodedata/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://flashcode-milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
        - flashcode_network

  flashcode-milvus-minio:
    container_name: flashcode-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ../data/flashcodedata/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      start_period: 60s
      timeout: 40s
      retries: 5
    networks:
      - flashcode_network

  flashcode-milvus-standalone:
    container_name: flashcode-milvus-standalone
    image: milvusdb/milvus:v3.0.1
    user: root
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    shm_size: 1g
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: flashcode-milvus-etcd:2379
      MINIO_ADDRESS: flashcode-milvus-minio:9000
    volumes:
      - ../data/flashcodedata/milvus/data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - flashcode_network
    depends_on:
      flashcode-milvus-etcd:
        condition: service_healthy
      flashcode-milvus-minio:
        condition: service_healthy

networks:
  flashcode_network:
