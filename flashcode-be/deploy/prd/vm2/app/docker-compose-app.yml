version: '3.8'
#启动命令 docker compose -p flashcode -f docker-compose-mid.yml up -d
services:
  flashcode-admin:
    build:
      context: service/admin
    image: flashcodeprd/bite-admin-service:1.0-SNAPSHOT
    container_name: flashcode-admin-prd
    ports:
      - "18081:18081"
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器2内网ip/你的虚拟机2内网ip
    networks:
      flashcode_network_prd:
  flashcode-file:
    build:
      context: service/file
    ports:
      - "18082:18082"
    image: flashcodeprd/bite-file-service:1.0-SNAPSHOT
    container_name: flashcode-file-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器2内网ip/你的虚拟机2内网ip
    networks:
      flashcode_network_prd:
  flashcode-gateway:
    build:
      context: service/gateway
    ports:
      - "18080:18080"
    image: flashcodeprd/bite-gateway-service:1.0-SNAPSHOT
    container_name: flashcode-gateway-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器2内网ip/你的虚拟机2内网ip
    networks:
      flashcode_network_prd:
  flashcode-portal:
    build:
      context: service/portal
    ports:
      - "18083:18083"
    image: flashcodeprd/bite-portal-service:1.0-SNAPSHOT
    container_name: flashcode-portal-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器2内网ip/你的虚拟机2内网ip
    networks:
      flashcode_network_prd:
networks:
  flashcode_network_prd:
