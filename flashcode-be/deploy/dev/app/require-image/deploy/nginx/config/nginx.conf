worker_processes auto;
worker_cpu_affinity auto;
# 最大打开文件数, 可设置为系统优化后的ulimit -HSn的结果, 调整系统文件描述和这个问题有相同之处
# 需要调整系统打开文件数量
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # 服务端
    server {
        listen       80;
        server_tokens off;
        merge_slashes off;

        location ~ ^/deploy/(\d+)/(.*)?$ {
            set $appId $1;
            alias /workspace/user-deploy/$appId/dist/;

            try_files $uri @spa_fallback;

            # 禁用自动添加斜杠的重定向
            absolute_redirect off;
            charset utf-8;
        }

        # 兜底路由: 完全合规, 无try_files/alias在if内
        location @spa_fallback {
            # 1. 提取项目ID并设置root (提前初始化, 避免if内赋值问题)
            set $appId "";
            set $static_file "";
            # 修正正则: 允许末尾有可选的/, 并捕获纯净的文件名
            if ($request_uri ~* ^/deploy/(\d+)/assets/(.*?)\.(js|css|png|jpg|jpeg|gif|ico|json)/?$) {
                set $appId $1;
                set $static_file $2.$3; # 此时$2无末尾/, $static_file是纯净文件名
            }
            if ($request_uri ~* ^/deploy/(\d+)/?$) {
                set $appId $1;
            }

            # 2. 静态资源处理 (无try_files, 用rewrite+root)
            if ($static_file != "") {
                root /workspace/user-deploy/$appId/dist/assets;
                rewrite ^ /$static_file break; # 直接指向assets下的文件 (无末尾/)
                expires 7d;
                access_log off;
                return 200; # 强制返回200, 找不到则自动404
            }

            # 3. 页面路由处理: 返回index.html
            root /workspace/user-deploy/$appId/dist;
            rewrite ^ /index.html break;
            index index.html;
        }
    }
}